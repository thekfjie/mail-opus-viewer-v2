x-app: &app
  build: .
  image: opusmail:local
  env_file: .env
  environment: &runtime
    NODE_ENV: production
    HOST: 0.0.0.0
    MYSQL_URL: mysql://opusmail:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/opusmail
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    V2_SESSION_SECRET: ${V2_SESSION_SECRET:?Keep existing session secret or generate one}
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Keep the existing encryption key}
    VIEWER_ADMIN_PASSWORD: ${VIEWER_ADMIN_PASSWORD:?Set admin password}
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opusmail
      MYSQL_USER: opusmail
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_bin]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h127.0.0.1 -uopusmail -Dopusmail -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction']
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [node, dist/server/server/storage/migrate.js]
    profiles: [tools]
  api:
    <<: *app
    ports: ['127.0.0.1:8790:8790']
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:8790/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [node, dist/server/server/worker.js]
    # One scheduler instance; do not scale this service without job leasing.
volumes:
  mysql-data:
  redis-data:
