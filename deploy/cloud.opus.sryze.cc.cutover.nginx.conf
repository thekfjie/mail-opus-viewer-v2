# Install after candidate verification and the final write-frozen backup.
limit_req_zone $binary_remote_addr zone=cloud_opus_v2_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cloud.opus.sryze.cc;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloud.opus.sryze.cc;
    ssl_certificate /etc/letsencrypt/live/cloud.opus.sryze.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.opus.sryze.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Keep webhook MIME and mail responses out of disk buffering and caches.
    client_max_body_size 16m;
    client_body_buffer_size 16m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 35s;

    location = /api/v2/admin/login {
        limit_req zone=cloud_opus_v2_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
    }
    location = /api/login {
        limit_req zone=cloud_opus_v2_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
    }
    # 保留已发放的 AutoMyAI 子邮箱取件入口，与当前线上路由一致。
    location ~ "^/api/public/apple-mail/code/[A-Za-z0-9_-]{32,160}$" {
        proxy_pass http://127.0.0.1:13030;
    }
    location / { proxy_pass http://127.0.0.1:8790; }
}
