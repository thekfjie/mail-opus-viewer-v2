limit_req_zone $binary_remote_addr zone=mail_opus_v2_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location = /api/v2/admin/login {
        limit_req zone=mail_opus_v2_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Legacy customer API compatibility for tabs opened before the rollback.
    location = /api/preset { proxy_pass http://127.0.0.1:8789; include proxy_params; }
    location = /api/login { proxy_pass http://127.0.0.1:8789; include proxy_params; }
    location = /api/logout { proxy_pass http://127.0.0.1:8789; include proxy_params; }
    location = /api/session { proxy_pass http://127.0.0.1:8789; include proxy_params; }
    location = /api/mails { proxy_pass http://127.0.0.1:8789; include proxy_params; proxy_read_timeout 120s; }
    location = /api/mail-detail { proxy_pass http://127.0.0.1:8789; include proxy_params; proxy_read_timeout 120s; }
    location = /api/password { proxy_pass http://127.0.0.1:8789/api/change-password; include proxy_params; }

    # Existing automation keeps the V1-compatible intake contract while the
    # V2 admin is active. This is loopback-authoritative and rollback-safe.
    location /api/v1/ { proxy_pass http://127.0.0.1:8789; include proxy_params; proxy_read_timeout 120s; }

    # V2 owns only its admin, admin-share and namespaced API/assets.
    location = /health { proxy_pass http://127.0.0.1:8790; include proxy_params; }
    location ^~ /api/v2/ { proxy_pass http://127.0.0.1:8790; include proxy_params; proxy_read_timeout 120s; }
    location ^~ /api/share/ { proxy_pass http://127.0.0.1:8790; include proxy_params; proxy_read_timeout 120s; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:8790; include proxy_params; }
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Customer mailbox pages always use the original V1 UI.
    location / { return 302 https://legacy-mail.example.com$request_uri; }
}
