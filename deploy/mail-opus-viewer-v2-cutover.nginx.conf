limit_req_zone $binary_remote_addr zone=cloud_opus_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name legacy-mail.example.com;
    client_max_body_size 2m;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name legacy-mail.example.com;
    ssl_certificate /etc/letsencrypt/live/legacy-mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy-mail.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Keep the V1 administrator hidden while restoring the complete original
    # customer mailbox UI and all of its API behavior.
    location = /admin { return 302 https://mail.example.com/admin; }
    location ^~ /admin/ { return 302 https://mail.example.com/admin; }
    location ^~ /api/admin/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
